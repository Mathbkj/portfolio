                  - heading "How it works" [level=3]
                - generic:
                  - generic:
                    - generic:
                      - heading "1. Consultation" [level=3]
                      - paragraph:
                        - text: An adventure to Antarctica requires a lot of planning and our team can easily guide you through the process. Send us an enquiry or
                        - link "book a call directly":
                          - /url: https://meetings-eu1.hubspot.com/meghan-sales/booktime?__hstc=152474470.cd471786c30f3560a5ec3ed9169d561a.1789515577514.1789515577514.1789515577514.1&__hssc=152474470.1.1789515577514&__hsfp=d40dfcd3cca0e735e5a883a03098d646
                        - text: at your preferred time, with no obligation. We'll talk through the adventures you can expect, your ideal experience and preferred dates, then review availability.
                  - generic:
                    - generic:
                      - heading "2. Confirmation" [level=3]
                      - paragraph: After you confirm your dates, secured by a deposit, we’ll assist you in completing the necessary forms, such as travel insurance and a medical check completed within 30 days, to ensure your safety on ice.
                  - generic:
                    - generic:
                      - heading "3. Planning" [level=3]
                      - paragraph: Book flexible flights, arriving in Cape Town at least two days prior to your scheduled Antarctic trip, and departing two days after your arrival, in case of weather delays. Our team can also arrange accommodation, private transfers in our electric BMW fleet, and curated experiences in Cape Town and the Winelands. If you wish to book a safari or explore more of Southern Africa, we are happy to assist.
                  - generic:
                    - generic:
                      - heading "4. On-Boarding" [level=3]
                      - paragraph: As your departure date approaches, our team will guide you through every necessary step — most importantly, what to pack. You can purchase recommended items through our online Boutique featuring exclusive co-branded polar gear, or have our team prepare a full kit ready for your arrival in Cape Town.
                  - generic:
                    - generic:
                      - heading "5. Safety Briefing" [level=3]
                      - paragraph: After arriving in Cape Town, our vehicles will transfer you to a safety briefing at our offices at 16 Loop Street, where we will go through the itinerary, updated flight schedule and answer any questions. The team will then check your kit, assist with anything you may have forgotten, and help pack the first polar outfit you’ll need to change into on the flight south.
                  - generic:
                    - generic:
                      - heading "6. Departure" [level=3]
                      - paragraph: On departure day, our drivers will collect you from your hotel and escort you to the airport, where our team will fast-track you through security and customs. You’ll then head to the lounge before boarding your direct flight to Antarctica.
